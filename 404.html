<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAG AMBALAJ - Yeni adrese taşındı</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1e293b;font-family:Arial,sans-serif;color:#fff;text-align:center}
.k{background:#fff;color:#1e293b;border-radius:14px;padding:28px 22px;max-width:360px;margin:16px}
h1{color:#c82333;font-size:22px;margin:0 0 10px}
a{display:block;background:#c82333;color:#fff;text-decoration:none;font-weight:bold;padding:14px;border-radius:10px;margin-top:16px}
p{margin:8px 0;font-size:15px}
</style>
</head>
<body>
<div class="k">
<h1>MAG AMBALAJ</h1>
<p>Uygulama yeni adrese taşındı.</p>
<p>Yönlendiriliyorsunuz...</p>
<a id="g" href="https://sevkiyat-fc22b.web.app/">Yeni adrese git</a>
<p style="font-size:13px;color:#64748b">Telefonunuzda ana ekrandaki eski kısayol varsa silip yeni adresi yeniden ekleyin.</p>
</div>
<script>
(function(){
  var y="https://sevkiyat-fc22b.web.app/"+location.search+location.hash;
  document.getElementById("g").href=y;
  try{
    if(navigator.serviceWorker){
      navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.update()})});
    }
  }catch(e){}
  location.replace(y);
})();
</script>
</body>
</html>
