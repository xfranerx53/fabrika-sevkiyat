name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sevkiyat-fc22b
          channelId: live
