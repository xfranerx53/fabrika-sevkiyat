# Claude'un yönetim işleri: sağlık, teşhis (özel depoya), Firebase kural kontrolü/yayını, Cloudflare kontrolü.
# Herkese açık kayda yalnız sayılar yazılır. Teşhis verisi yalnız ÖZEL depo xfranerx53/mag-yonetim'e gider (secret YONETIM_TOKEN).
# Elle: Actions → "Yönetim" → Run workflow. Claude ayrıca .github/yonetim-istek.txt dosyasını değiştirerek tetikler. Her sabah 06:41 teşhis.
name: Yönetim
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "saglik | teshis | kural-kontrol | kural-yayinla | ajan-izin | komut | bildirim-yayinla | granul-aktar | fabrika-konum | adres-konum | cari-aktar | oneri-aktar | oneri-kaydet"
        default: saglik
  push:
    branches: [main]
    paths: [".github/yonetim-istek.txt"]
  schedule:
    - cron: "41 3 * * *"
permissions:
  contents: read
concurrency:
  group: yonetim
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: İşlemi belirle
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then ISLEM=teshis; fi
          if [ -z "$ISLEM" ]; then ISLEM=$(head -1 .github/yonetim-istek.txt | tr -d '\r '); fi
          echo "ISLEM=$ISLEM" >> "$GITHUB_ENV"
      - name: Çalıştır
        run: node .github/yonetim.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DB_URL: https://sevkiyat-fc22b-default-rtdb.firebaseio.com
          KOK: ""
          KURAL_DOSYA: rules.json
          AJAN_KUL: magajan
          HARIC: "fotoTam,fotolar,dosyaFoto,okumaAyar,foto,irsaliye,irsEkler,anahtar,sifre"
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YONETIM_TOKEN: ${{ secrets.YONETIM_TOKEN }}
          PROJE_AD: fabrika
      - name: Teşhisi özel depoya yaz
        if: env.ISLEM == 'teshis' || env.ISLEM == 'adres-konum' || env.ISLEM == 'oneri-kaydet'
        env:
          TOKEN: ${{ secrets.YONETIM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "YONETIM_TOKEN yok — teşhis özel depoya yazılamadı"; exit 1; fi
          git clone -q --depth 1 "https://x-access-token:$TOKEN@github.com/xfranerx53/mag-yonetim.git" yon
          mkdir -p "yon/fabrika-sevkiyat" && cp teshis/* "yon/fabrika-sevkiyat/" 2>/dev/null || true
          cd yon && git config user.name "mag-ajan" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && (git commit -q -m "teşhis fabrika-sevkiyat $(TZ=Europe/Istanbul date +%F_%H%M)" && git push -q && echo "✅ Teşhis özel depoya yazıldı") || echo "Değişiklik yok"
