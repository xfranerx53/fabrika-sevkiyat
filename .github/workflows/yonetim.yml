# Claude'un yönetim işleri: sağlık kontrolü, Firebase kural kontrolü/yayını, Cloudflare kontrolü.
# Anahtarlar: secrets FIREBASE_SERVICE_ACCOUNT, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Uygulama koduna dokunmaz.
# Elle: Actions → "Yönetim" → Run workflow. Claude ayrıca .github/yonetim-istek.txt dosyasını değiştirerek tetikler.
name: Yönetim
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "saglik | kural-kontrol | kural-yayinla"
        default: saglik
  push:
    branches: [main]
    paths: [".github/yonetim-istek.txt"]
permissions:
  contents: read
concurrency:
  group: yonetim
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Çalıştır
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ -z "$ISLEM" ]; then ISLEM=$(head -1 .github/yonetim-istek.txt | tr -d '\r '); fi
          ISLEM="$ISLEM" node .github/yonetim.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DB_URL: https://sevkiyat-fc22b-default-rtdb.firebaseio.com
          KURAL_DOSYA: rules.json
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
